[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cursor-ai-sdlc-pipeline"
version = "0.1.0"
description = "Cursor SDK orchestrator that runs an SDLC pipeline from a Jira story ID"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cursor-sdk>=1.3.0",
  "python-dotenv>=1.0.0",
  "requests>=2.31.0",
]

[project.scripts]
sdlc-orchestrator = "sdlc_pipeline.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
